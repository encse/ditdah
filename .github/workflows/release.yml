name: Release

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Version must look like 1.2.0 or 1.2.0-rc.1."
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: ditdah-linux-amd64
            executable: ditdah
            simd: false
          - runner: windows-2025
            artifact: ditdah-windows-amd64
            executable: ditdah.exe
            simd: false
          - runner: macos-15-intel
            artifact: ditdah-macos-amd64
            executable: ditdah
            simd: false
          - runner: macos-15
            artifact: ditdah-macos-arm64
            executable: ditdah
            simd: true

    env:
      CGO_ENABLED: "1"
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: make mingw-w64-x86_64-gcc

      - name: Restore Hamlib build
        uses: actions/cache@v5
        with:
          path: .build/hamlib
          key: hamlib-4.7.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-hamlib.sh') }}

      - name: Build Hamlib
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build-hamlib.sh

      - name: Build Hamlib
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./scripts/build-hamlib.sh

      - name: Test
        if: runner.os != 'Windows'
        run: go test ./...

      - name: Test
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test ./...

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          if [[ "${{ matrix.simd }}" == "true" ]]; then
            if GOEXPERIMENT=simd go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "package/${{ matrix.executable }}" .; then
              echo "Built with the Go SIMD experiment."
            else
              echo "::warning::SIMD build failed; falling back to the scalar implementation."
              go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "package/${{ matrix.executable }}" .
            fi
          else
            go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "package/${{ matrix.executable }}" .
          fi
          cp README.md LICENSE THIRD_PARTY_NOTICES.md package/
          mkdir -p package/licenses/hamlib
          cp .build/hamlib/4.7.2/*/share/doc/hamlib/{AUTHORS,COPYING,COPYING.LIB,LICENSE,README.md} package/licenses/hamlib/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C package .

      - name: Build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p package
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon docs/icon.png --manifest none
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG} -linkmode external -extldflags=-static" -o "package/${{ matrix.executable }}" .
          if objdump -p "package/${{ matrix.executable }}" | grep -qi 'DLL Name: libwinpthread-1.dll'; then
            echo "::error::Windows executable unexpectedly depends on libwinpthread-1.dll"
            exit 1
          fi
          cp README.md LICENSE THIRD_PARTY_NOTICES.md package/
          mkdir -p package/licenses/hamlib
          cp .build/hamlib/4.7.2/*/share/doc/hamlib/{AUTHORS,COPYING,COPYING.LIB,LICENSE,README.md} package/licenses/hamlib/

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

      - name: Upload Hamlib source
        if: matrix.artifact == 'ditdah-linux-amd64'
        uses: actions/upload-artifact@v7
        with:
          name: hamlib-4.7.2-source
          path: .build/hamlib/downloads/hamlib-4.7.2.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create and push release tag
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Tag $TAG was created while the release was building."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "DitDah $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$TAG" release/* --verify-tag --generate-notes --title "$TAG"
      
      - name: Calculate Homebrew checksums
        id: brew
        shell: bash
        run: |
          echo "arm64_sha=$(sha256sum release/ditdah-macos-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "amd64_sha=$(sha256sum release/ditdah-macos-amd64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: encse/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          ARM64_SHA: ${{ steps.brew.outputs.arm64_sha }}
          AMD64_SHA: ${{ steps.brew.outputs.amd64_sha }}
        run: |
          VERSION_NUMBER="${VERSION#v}"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("homebrew-tap/Formula/ditdah.rb")
          text = path.read_text()

          version = os.environ["VERSION"]
          version_number = version.removeprefix("v")
          arm64_sha = os.environ["ARM64_SHA"]
          amd64_sha = os.environ["AMD64_SHA"]

          text = re.sub(
              r'version "[^"]+"',
              f'version "{version_number}"',
              text,
          )

          text = re.sub(
              r'https://github\.com/encse/ditdah/releases/download/v[^/]+/ditdah-macos-arm64\.tar\.gz',
              f'https://github.com/encse/ditdah/releases/download/{version}/ditdah-macos-arm64.tar.gz',
              text,
          )

          text = re.sub(
              r'https://github\.com/encse/ditdah/releases/download/v[^/]+/ditdah-macos-amd64\.tar\.gz',
              f'https://github.com/encse/ditdah/releases/download/{version}/ditdah-macos-amd64.tar.gz',
              text,
          )

          text = re.sub(
              r'(ditdah-macos-arm64\.tar\.gz"\n\s+sha256 ")[^"]+',
              rf'\g<1>{arm64_sha}',
              text,
          )

          text = re.sub(
              r'(ditdah-macos-amd64\.tar\.gz"\n\s+sha256 ")[^"]+',
              rf'\g<1>{amd64_sha}',
              text,
          )

          path.write_text(text)
          PY

      - name: Commit Homebrew formula
        working-directory: homebrew-tap
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/ditdah.rb

          if git diff --cached --quiet; then
            echo "Formula is already up to date."
            exit 0
          fi

          git commit -m "ditdah $TAG"
          git push
