name: Build releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: ditdah-linux-amd64
            executable: ditdah
            simd: false
          - runner: windows-2025
            artifact: ditdah-windows-amd64
            executable: ditdah.exe
            simd: false
          - runner: macos-15-intel
            artifact: ditdah-macos-amd64
            executable: ditdah
            simd: false
          - runner: macos-15
            artifact: ditdah-macos-arm64
            executable: ditdah
            simd: true

    env:
      CGO_ENABLED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          if [[ "${{ matrix.simd }}" == "true" ]]; then
            if GOEXPERIMENT=simd go build -trimpath -o "package/${{ matrix.executable }}" .; then
              echo "Built with the Go SIMD experiment."
            else
              echo "::warning::SIMD build failed; falling back to the scalar implementation."
              go build -trimpath -o "package/${{ matrix.executable }}" .
            fi
          else
            go build -trimpath -o "package/${{ matrix.executable }}" .
          fi
          cp README.md package/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C package .

      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          go build -trimpath -o "package/${{ matrix.executable }}" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
      
      - name: Calculate Homebrew checksums
        id: brew
        shell: bash
        run: |
          echo "arm64_sha=$(sha256sum release/ditdah-macos-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "amd64_sha=$(sha256sum release/ditdah-macos-amd64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: encse/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARM64_SHA: ${{ steps.brew.outputs.arm64_sha }}
          AMD64_SHA: ${{ steps.brew.outputs.amd64_sha }}
        run: |
          VERSION_NUMBER="${VERSION#v}"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("homebrew-tap/Formula/ditdah.rb")
          text = path.read_text()

          version = os.environ["VERSION"]
          version_number = version.removeprefix("v")
          arm64_sha = os.environ["ARM64_SHA"]
          amd64_sha = os.environ["AMD64_SHA"]

          text = re.sub(
              r'version "[^"]+"',
              f'version "{version_number}"',
              text,
          )

          text = re.sub(
              r'https://github\.com/encse/ditdah/releases/download/v[^/]+/ditdah-macos-arm64\.tar\.gz',
              f'https://github.com/encse/ditdah/releases/download/{version}/ditdah-macos-arm64.tar.gz',
              text,
          )

          text = re.sub(
              r'https://github\.com/encse/ditdah/releases/download/v[^/]+/ditdah-macos-amd64\.tar\.gz',
              f'https://github.com/encse/ditdah/releases/download/{version}/ditdah-macos-amd64.tar.gz',
              text,
          )

          text = re.sub(
              r'(ditdah-macos-arm64\.tar\.gz"\n\s+sha256 ")[^"]+',
              rf'\g<1>{arm64_sha}',
              text,
          )

          text = re.sub(
              r'(ditdah-macos-amd64\.tar\.gz"\n\s+sha256 ")[^"]+',
              rf'\g<1>{amd64_sha}',
              text,
          )

          path.write_text(text)
          PY

      - name: Commit Homebrew formula
        working-directory: homebrew-tap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/ditdah.rb

          if git diff --cached --quiet; then
            echo "Formula is already up to date."
            exit 0
          fi

          git commit -m "ditdah ${GITHUB_REF_NAME}"
          git push