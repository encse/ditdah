name: Build releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: ditdah-linux-amd64
            executable: ditdah
            simd: false
          - runner: windows-2025
            artifact: ditdah-windows-amd64
            executable: ditdah.exe
            simd: false
          - runner: macos-15-intel
            artifact: ditdah-macos-amd64
            executable: ditdah
            simd: false
          - runner: macos-15
            artifact: ditdah-macos-arm64
            executable: ditdah
            simd: true

    env:
      CGO_ENABLED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          if [[ "${{ matrix.simd }}" == "true" ]]; then
            if GOEXPERIMENT=simd go build -trimpath -o "package/${{ matrix.executable }}" .; then
              echo "Built with the Go SIMD experiment."
            else
              echo "::warning::SIMD build failed; falling back to the scalar implementation."
              go build -trimpath -o "package/${{ matrix.executable }}" .
            fi
          else
            go build -trimpath -o "package/${{ matrix.executable }}" .
          fi
          cp README.md package/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C package .

      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          go build -trimpath -o "package/${{ matrix.executable }}" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
